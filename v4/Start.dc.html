a{color:inherit;text-decoration:none}
.nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:60px;gap:20px;max-width:1180px;margin:0 auto;padding:0 32px}
.nl{display:flex;gap:30px}

.drop{width:100%;height:420px;border-radius:35px;border:0;background:var(--s1);color:var(--ink);font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.drop:hover .orb{transform:scale(1.06)}
.orb{width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#F1D88E,#C9A84C 55%,#8E6E22);color:#151004;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 20px 60px -16px rgba(201,168,76,.7);transition:transform .4s cubic-bezier(.16,1,.3,1)}

<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["ar","en"],"default":"ar"},"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"stage":{"editor":"enum","options":["drop","results","sent"],"default":"drop"},"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {

    const N = (n) => ar ? String(n).replace(/\d/g, (x) => '٠١٢٣٤٥٦٧٨٩'[x]).replace('.', '٫') : String(n);

      theme: L('Theme', 'المظهر'), menu: L('Main', 'القائمة'), nFest: L('Festivals', 'المهرجانات'), nFilms: L('Films', 'الأفلام'), nHow: L('How it works', 'كيف يعمل'), nPlans: L('Plans', 'الباقات'),
      signin: L('Sign in', 'دخول'), start: L('Start', 'ابدأ'),

      drop: L('Drop it here', 'اسحب الفيلم إلى هنا'), dropP: L('MP4 or MOV up to 20 GB — or click to choose', 'أو اضغط لاختياره من جهازك · MP4 أو MOV حتى ٢٠ جيجا'),
      linkPh: L('or paste a private link', 'أو ضع رابطًا خاصًا من Vimeo أو YouTube أو Drive'), useLink: L('Use link', 'تابع بالرابط'), private: L('Private. Only the festivals you choose will ever see it.', 'فيلمك في أمان، ولن يشاهده إلا من تختار من المهرجانات.'),

      loglineK: L('YOUR FILM IN ONE LINE', 'فيلمك في سطر'), matchK: L('WHERE IT BELONGS', 'المهرجانات الأنسب له'),
      email: L('Your email', 'بريدك الإلكتروني'), openStudio: L('Open my studio', 'انتقل إلى الاستوديو')
    };
    const log = L('On the last winter of the Sarawat slopes, a grandmother refuses to leave the mountain her family has herded for three generations.', 'في شتائها الأخير على جبال السروات، جدّةٌ تأبى أن تترك الجبل الذي رعت فيه عائلتها ثلاثة أجيال.');
    const words = log.split(' ');

    const scoreTarget = 8.7;
    const sNow = T < 2.2 ? 0 : Math.min(scoreTarget, (T - 2.2) * 4);
    const meta = [L('Documentary', 'وثائقي'), L('88 min', '٨٨ دقيقة'), L('Arabic', 'عربي'), L('EN subtitles', 'ترجمة إنجليزية'), '1080p'].map((l, i) => ({ l, d: 'animation-delay: ' + (i * 0.08).toFixed(2) + 's;' }));
