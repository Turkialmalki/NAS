<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>NAS — Festivals</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&amp;family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&amp;family=Readex+Pro:wght@300..700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0A0B}
*{box-sizing:border-box}
.th-dark{--bg:#0A0A0B;--s1:#111113;--s2:#18181B;--s3:#222226;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);--ink:#F4F2EC;--ink2:#D6D3CB;--muted:#A3A19A;--faint:#8C8A83;--gold:#C9A84C;--goldHi:#E2C36E;--goldT:rgba(201,168,76,.12);--goldL:rgba(201,168,76,.4);--onGold:#151004;--ok:#5BC08A;--okT:rgba(91,192,138,.13);--no:#EE7A6E;--noT:rgba(238,122,110,.13);--info:#86AEF2;--infoT:rgba(134,174,242,.13);--navBg:rgba(10,10,11,.78);--shadow:inset 0 1px 0 rgba(255,255,255,.04),0 24px 48px -28px rgba(0,0,0,.9);--glow:radial-gradient(800px 380px at 50% -12%,rgba(201,168,76,.13),rgba(201,168,76,0) 70%);color-scheme:dark}
.th-light{--bg:#F8F7F4;--s1:#FFFFFF;--s2:#F2F1ED;--s3:#E8E6E0;--line:rgba(20,18,12,.08);--line2:rgba(20,18,12,.14);--ink:#141413;--ink2:#2F2D29;--muted:#5F5C56;--faint:#6B6862;--gold:#B08A33;--goldHi:#7E5E12;--goldT:rgba(201,168,76,.16);--goldL:rgba(169,130,46,.45);--onGold:#151004;--ok:#23794A;--okT:rgba(35,121,74,.1);--no:#B8402F;--noT:rgba(184,64,47,.1);--info:#2F5FB3;--infoT:rgba(47,95,179,.1);--navBg:rgba(248,247,244,.82);--shadow:0 1px 2px rgba(20,18,12,.05),0 16px 36px -24px rgba(20,18,12,.22);--glow:radial-gradient(800px 380px at 50% -12%,rgba(201,168,76,.14),rgba(201,168,76,0) 70%);color-scheme:light}
[dir=rtl] h1,[dir=rtl] h2,[dir=rtl] h3{font-family:'Readex Pro','IBM Plex Sans Arabic',sans-serif;letter-spacing:0 !important}
[dir=ltr] h1,[dir=ltr] h2{letter-spacing:-.03em}
a{color:inherit;text-decoration:none}
.wrap{max-width:1200px;margin:0 auto;padding:0 32px}
.btn{height:44px;padding:0 20px;border-radius:12px;font:inherit;font-size:15px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;border:1px solid transparent;white-space:nowrap;transition:filter .2s,background .2s,border-color .2s}
.btn-p{background:var(--gold);color:var(--onGold)}
.btn-p:hover{filter:brightness(1.08)}
.btn-s{background:var(--s2);color:var(--ink);border-color:var(--line2)}
.btn-s:hover{border-color:var(--goldL)}
.btn-g{background:transparent;color:var(--ink2)}
.btn-g:hover{background:var(--s2)}
.ibtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line2);background:transparent;color:var(--ink2);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font:inherit;font-size:13px;font-weight:700}
.ibtn:hover{border-color:var(--goldL);color:var(--ink)}
.nl a{height:36px;padding:0 14px;border-radius:10px;display:inline-flex;align-items:center;color:var(--muted);font-size:15px;font-weight:500}
.nl a:hover{color:var(--ink);background:var(--s2)}
.nl a.on{color:var(--ink);background:var(--s2)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:99px;font-size:12.5px;font-weight:600;white-space:nowrap}
.c-ok{background:var(--okT);color:var(--ok)}
.c-gold{background:var(--goldT);color:var(--goldHi)}
.c-info{background:var(--infoT);color:var(--info)}
.c-mute{background:var(--s2);color:var(--muted)}
.seg{display:inline-flex;padding:4px;border-radius:14px;background:var(--s2);border:1px solid var(--line);gap:2px;flex-wrap:wrap}
.seg button{height:38px;padding:0 16px;border-radius:10px;border:0;background:transparent;color:var(--muted);font:inherit;font-size:14.5px;font-weight:600;cursor:pointer}
.fld{width:100%;height:52px;border-radius:14px;background:var(--s1);border:1px solid var(--line2);color:var(--ink);font:inherit;font-size:16px;padding:0 48px;outline:none}
.fld:focus{border-color:var(--gold);box-shadow:0 0 0 4px var(--goldT)}
.sel{height:52px;border-radius:14px;background:var(--s1);border:1px solid var(--line2);color:var(--ink);font:inherit;font-size:15px;padding:0 14px;outline:none;min-width:180px}
.fc{overflow:hidden;transition:transform .3s,border-color .3s}
.fc:hover{transform:translateY(-3px);border-color:var(--goldL)}
.fc img{transition:transform .6s}
.fc:hover img{transform:scale(1.04)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fu{animation:fadeUp .4s cubic-bezier(.16,1,.3,1) both}
@media (max-width:900px){.nl,.hide-s{display:none !important}.wrap{padding:0 16px}.g3{grid-template-columns:minmax(0,1fr) !important}}
.nav2{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:60px;gap:20px;max-width:1180px;margin:0 auto;padding:0 32px}
.nl2{display:flex;gap:30px}
.nl2 a{font-size:14px;color:var(--muted);transition:color .2s}
.nl2 a:hover,.nl2 a.on{color:var(--ink)}
.tbtn2{width:34px;height:34px;border-radius:99px;border:0;background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font:inherit;font-size:12.5px;font-weight:700}
.tbtn2:hover{color:var(--ink);background:var(--s2)}
.pill2{height:34px;padding:0 16px;border-radius:99px;background:var(--gold);color:var(--onGold);font-size:14px;font-weight:600;display:inline-flex;align-items:center}
.pill2:hover{filter:brightness(1.08)}
@media (max-width:900px){.nl2,.hs2{display:none !important}.nav2{grid-template-columns:1fr auto;padding:0 16px}}
</style>
</helmet>
<div class="{{themeClass}}" dir="{{dir}}" style="font-family: {{font}}; background: var(--bg); color: var(--ink); min-height: 900px; -webkit-font-smoothing: antialiased;">

<header style="position: sticky; top: 0; z-index: 30; background: var(--navBg); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid var(--line);">
<div class="nav2">
<a href="Main.dc.html" aria-label="NAS" style="justify-self: start;"><img src="/_blob/975845359f68a7d023125a410efe44f4" alt="NAS" style="height: 22px; width: auto; display: block;"></a>
<nav class="nl2" aria-label="{{nv.menu}}"><a href="Festivals.dc.html" class="on" aria-current="page">{{nv.fest}}</a><a href="Films.dc.html">{{nv.films}}</a><a href="Main.dc.html#how">{{nv.how}}</a><a href="Plans.dc.html">{{nv.plans}}</a></nav>
<div style="justify-self: end; display: flex; align-items: center; gap: 4px;">
<button type="button" class="tbtn2" onClick="{{toggleTheme}}" aria-label="{{nv.theme}}"><sc-if value="{{isDark}}" hint-placeholder-val="{{true}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if><sc-if value="{{isLight}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg></sc-if></button>
<button type="button" class="tbtn2" onClick="{{toggleLang}}" aria-label="Language">{{langBtn}}</button>
<a href="SignIn.dc.html" class="hs2" style="font-size: 14px; color: var(--muted); padding: 0 12px;">{{nv.signin}}</a>
<a href="Start.dc.html" class="pill2">{{nv.start}}</a>
</div>
</div>
</header>

<section style="background: var(--glow) top / 100% 420px no-repeat; padding: 72px 0 0;">
<div class="wrap" style="display: flex; flex-direction: column; gap: 14px;">
<h1 style="margin: 0; font-size: 60px; font-weight: 700;">{{t.h1}}</h1>
<p style="margin: 0; color: var(--muted); font-size: 19px; max-width: 620px; line-height: 1.6;">{{t.lede}}</p>
<div style="display: flex; gap: 12px; flex-wrap: wrap; margin-top: 22px; align-items: center;">
<label style="position: relative; flex: 1 1 360px; display: block;"><span style="position: absolute; inset-inline-start: 18px; top: 17px; color: var(--faint);"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></span><input class="fld" value="{{q}}" onChange="{{onQ}}" placeholder="{{t.search}}" aria-label="{{t.search}}"></label>
<select class="sel" aria-label="{{t.city}}" value="{{city}}" onChange="{{onCity}}"><sc-for list="{{cities}}" as="c" hint-placeholder-count="5"><option value="{{c.v}}">{{c.l}}</option></sc-for></select>
</div>
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 8px;">
<div class="seg" role="group" aria-label="{{t.status}}"><sc-for list="{{segs}}" as="s" hint-placeholder-count="4"><button type="button" onClick="{{s.pick}}" aria-pressed="{{s.on}}" style="{{s.style}}">{{s.l}}</button></sc-for></div>
<span style="color: var(--faint); font-size: 14.5px;">{{countLabel}}</span>
</div>
</div>
</section>

<section class="wrap" style="padding-top: 28px; padding-bottom: 96px;">
<div class="g3" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px;">
<sc-for list="{{list}}" as="f" hint-placeholder-count="6"><a href="Festival.dc.html" class="card fc fu" style="display: flex; flex-direction: column;"><div style="aspect-ratio: 16 / 10; overflow: hidden; position: relative;"><img src="{{f.img}}" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block;"><span class="chip {{f.cls}}" style="position: absolute; top: 14px; inset-inline-start: 14px; backdrop-filter: blur(12px); background: rgba(10,10,11,.6);">{{f.st}}</span></div><div style="padding: 20px 22px 22px; display: flex; flex-direction: column; gap: 8px; flex: 1;"><b style="font-size: 18px; display: flex; align-items: center; gap: 8px;">{{f.n}}<svg width="15" height="15" viewBox="0 0 24 24" fill="var(--gold)" role="img" aria-label="{{t.verified}}"><path d="M12 2l2.4 2.1 3.2-.3.9 3.1 2.8 1.6-1.1 3 1.1 3-2.8 1.6-.9 3.1-3.2-.3L12 22l-2.4-2.1-3.2.3-.9-3.1-2.8-1.6 1.1-3-1.1-3 2.8-1.6.9-3.1 3.2.3z"></path></svg></b><span style="color: var(--muted); font-size: 14.5px;">{{f.c}}</span><span style="display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px;"><sc-for list="{{f.tags}}" as="g" hint-placeholder-count="2"><span class="chip c-mute">{{g}}</span></sc-for></span><span style="display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 14px; border-top: 1px solid var(--line); font-size: 14px;"><span style="color: var(--faint);">{{f.dl}}</span><b>{{f.d}}</b></span></div></a></sc-for>
</div>
<sc-if value="{{empty}}" hint-placeholder-val="{{false}}"><div class="card" style="padding: 64px 24px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px;"><b style="font-size: 20px;">{{t.none}}</b><span style="color: var(--muted);">{{t.noneP}}</span><button type="button" class="btn btn-s" onClick="{{reset}}" style="margin-top: 6px;">{{t.clear}}</button></div></sc-if>
</section>

<footer style="border-top: 1px solid var(--line);"><div class="wrap" style="padding-top: 28px; padding-bottom: 28px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; color: var(--faint); font-size: 13.5px;"><img src="/_blob/975845359f68a7d023125a410efe44f4" alt="NAS" style="height: 22px; width: auto;"><span>{{t.copy}}</span></div></footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["ar","en"],"default":"ar"},"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1440,"height":1450}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { lang: null, theme: null, seg: 0, q: '', city: 'all' }; }
  renderVals() {
    const lang = this.state.lang || this.props.lang || 'ar';
    const theme = this.state.theme || this.props.theme || 'dark';
    const ar = lang === 'ar';
    const L = (e, a) => ar ? a : e;
    const t = {
      theme: L('Theme', 'المظهر'), nFest: L('Festivals', 'المهرجانات'), nHow: L('How it works', 'كيف يعمل'), nFor: L('For festivals', 'للمهرجانات'), nPlans: L('Plans', 'الباقات'),
      track: L('Track a submission', 'تتبّع مشاركتك'), signin: L('Sign in', 'دخول'), submit: L('Submit a film', 'قدّم فيلمك'),
      h1: L('Festivals', 'المهرجانات'), lede: L('Every festival here is verified by the NAS team. Upload once — we match your film to the right ones.', 'كل مهرجان هنا راجعه فريق NAS بنفسه. ارفع فيلمك مرة، ونقول لك أين يناسب.'),
      search: L('Search by festival or city', 'ابحث باسم المهرجان أو المدينة'), city: L('City', 'المدينة'), status: L('Status', 'الحالة'), verified: L('Verified', 'موثّق'),
      none: L('No festivals match', 'ما وجدنا مهرجانًا بهذا البحث'), noneP: L('Try another city or clear the search.', 'جرّب مدينة أخرى، أو امسح البحث.'), clear: L('Clear filters', 'امسح الفلاتر'),
      copy: L('© 2026 NAS', '© ٢٠٢٦ NAS')
    };
    const all = [
      ['ruh', '/_blob/25a9972bc44a28dd6db9377cb6546e2e', L('Riyadh Film Nights', 'أسبوع ليالي الرياض السينمائي'), L('Riyadh · 12–20 Nov 2027', 'الرياض · ١٢–٢٠ نوفمبر ٢٠٢٧'), 1, L('15 Jan', '١٥ يناير'), [L('Features', 'طويل'), L('Documentary', 'وثائقي')]],
      ['jed', '/_blob/7a67dd6a8ed910af190a6d73b88223a2', L('Jeddah Historic Cinema Days', 'أيام سينما جدة التاريخية'), L('Jeddah · Feb 2027', 'جدة · فبراير ٢٠٢٧'), 2, L('28 Dec', '٢٨ ديسمبر'), [L('Shorts', 'قصير'), L('Heritage', 'تراث')]],
      ['ula', '/_blob/4963e7a196f83370e811448ef31c5e4c', L('AlUla Short Films', 'أفلام العُلا القصيرة'), L('AlUla · Mar 2027', 'العُلا · مارس ٢٠٢٧'), 1, L('5 Feb', '٥ فبراير'), [L('Shorts', 'قصير'), L('Free entry', 'مجاني')]],
      ['dmm', '/_blob/9d90dd82bf08bb1350e8c1fcd6774d7e', L('Dhahran Cinema Nights', 'ليالي الظهران السينمائية'), L('Dhahran · Apr 2027', 'الظهران · أبريل ٢٠٢٧'), 1, L('20 Feb', '٢٠ فبراير'), [L('Features', 'طويل'), L('Shorts', 'قصير')]],
      ['ruh', '/_blob/f0c0927ab01a00b979d0f795462df5cb', L('Riyadh Student Film Showcase', 'معرض الرياض لأفلام الطلاب'), L('Riyadh · May 2027', 'الرياض · مايو ٢٠٢٧'), 3, L('Opens 1 Jan', 'يفتح ١ يناير'), [L('Students', 'طلاب')]],
      ['med', '/_blob/07a6092db243a79066a95642b1423f60', L('Madinah Heritage Film Days', 'أيام المدينة لأفلام التراث'), L('Madinah · Jun 2027', 'المدينة · يونيو ٢٠٢٧'), 3, L('Opens 15 Jan', 'يفتح ١٥ يناير'), [L('Heritage', 'تراث'), L('Documentary', 'وثائقي')]]
    ];
    const stL = { 1: [L('Open', 'مفتوح'), 'c-ok'], 2: [L('Closing soon', 'يغلق قريبًا'), 'c-gold'], 3: [L('Opening soon', 'يفتح قريبًا'), 'c-info'] };
    const seg = this.state.seg, q = this.state.q.trim(), city = this.state.city;
    const list = all.filter((f) => (seg === 0 || f[4] === seg) && (city === 'all' || f[0] === city) && (!q || (f[2] + f[3]).toLowerCase().indexOf(q.toLowerCase()) >= 0))
      .map((f) => ({ img: f[1], n: f[2], c: f[3], st: stL[f[4]][0], cls: stL[f[4]][1], d: f[5], dl: f[4] === 3 ? L('Submissions', 'المشاركات') : L('Closes', 'يغلق'), tags: f[6] }));
    const segs = [L('All', 'الكل'), L('Open', 'مفتوح'), L('Closing soon', 'يغلق قريبًا'), L('Opening soon', 'يفتح قريبًا')].map((l, i) => ({ l, on: seg === i, pick: () => this.setState({ seg: i }),
      style: seg === i ? 'background: var(--s1); color: var(--ink); box-shadow: var(--shadow);' : '' }));
    const cities = [['all', L('All cities', 'كل المدن')], ['ruh', L('Riyadh', 'الرياض')], ['jed', L('Jeddah', 'جدة')], ['ula', L('AlUla', 'العُلا')], ['dmm', L('Dhahran', 'الظهران')], ['med', L('Madinah', 'المدينة')]].map((c) => ({ v: c[0], l: c[1] }));
    const n = list.length;
    return {
      nv: { menu: L('Main', 'القائمة'), fest: L('Festivals', 'المهرجانات'), how: L('How it works', 'كيف يعمل'), forF: L('For festivals', 'للمهرجانات'), films: L('Films', 'الأفلام'), plans: L('Plans', 'الباقات'), track: L('Track', 'تتبّع'), theme: L('Theme', 'المظهر'), signin: L('Sign in', 'دخول'), start: L('Start', 'ابدأ') },
      themeClass: 'th-' + theme, isDark: theme === 'dark', isLight: theme === 'light',
      toggleTheme: () => this.setState({ theme: theme === 'dark' ? 'light' : 'dark' }), toggleLang: () => this.setState({ lang: ar ? 'en' : 'ar' }), langBtn: ar ? 'EN' : 'ع',
      dir: ar ? 'rtl' : 'ltr', font: ar ? "'IBM Plex Sans Arabic', 'Readex Pro', sans-serif" : "'Geist', 'IBM Plex Sans Arabic', sans-serif",
      t, list, segs, cities, empty: n === 0, q: this.state.q, city,
      onQ: (e) => this.setState({ q: e && e.target ? e.target.value : '' }), onCity: (e) => this.setState({ city: e && e.target ? e.target.value : 'all' }),
      reset: () => this.setState({ q: '', city: 'all', seg: 0 }),
      countLabel: ar ? (String(n).replace(/\d/g, (x) => '٠١٢٣٤٥٦٧٨٩'[x]) + ' ' + (n === 1 ? 'مهرجان' : 'مهرجانات')) : (n + (n === 1 ? ' festival' : ' festivals'))
    };
  }
}
</script>
</body>
</html>
