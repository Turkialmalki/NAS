<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>NAS — Sign up</title>
<meta name="description" content="NAS — the AI-native home for filmmakers, festivals and juries.">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{text-decoration:none}
.t-light{--bg:#F8F5EF;--card:#FFFFFF;--ink:#0C0C14;--ink2:#56524B;--ink3:#8F897F;--line:rgba(12,12,20,.08);--field:#E2DBCF;--btn:#0C0C14;--btnT:#FFFFFF;--acc:#B8501A;--tile:#EFE8DC;--chip:#FFFFFF;--orb1:#FFD9A8}
.t-dark{--bg:#07070C;--card:#12121B;--ink:#F5F2EC;--ink2:#B3AEA6;--ink3:#827E8A;--line:rgba(255,255,255,.09);--field:#2A2A38;--btn:#F5F2EC;--btnT:#0C0C14;--acc:#FFAE6B;--tile:#191925;--chip:#15151F;--orb1:rgba(255,140,60,.3)}
a{color:var(--acc)}
.lg-beam{animation:lgBeam 4s ease-in-out infinite}
@keyframes lgBeam{0%,100%{opacity:.25}50%{opacity:.85}}
.fade{animation:fade .8s ease both}
@keyframes fade{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
.f1{animation:fl 7s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.role{transition:background .2s ease, box-shadow .2s ease}.role:hover{background:var(--tile)}
.field{transition:border-color .2s ease, box-shadow .2s ease}
.field:focus-within{border-color:#FF7A3D;box-shadow:0 0 0 4px rgba(255,122,61,.15)}
.field input,.field select{outline:none}
.btn-ink{transition:transform .25s ease,box-shadow .25s ease}.btn-ink:hover{transform:translateY(-1px);box-shadow:0 12px 26px rgba(17,17,17,.25);color:#fff}
</style>
<style>body{margin:0}</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-tpl"><div class="{{ themeClass }}" style="min-height:100vh;box-sizing:border-box;padding:18px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;background:var(--bg);color:var(--ink);transition:background .5s ease,color .5s ease;font-family:'Thmanyah Sans','IBM Plex Sans Arabic',-apple-system,sans-serif"><main style="display:flex;flex-direction:column;gap:26px;padding:18px 40px 24px"><div style="display:flex;justify-content:space-between;align-items:center"><a href="/en" style="display:flex;align-items:center;gap:9px;color:var(--ink)" aria-label="NAS home"><svg viewBox="0 0 100 100" width="36" height="36" aria-hidden="true"><defs><linearGradient id="gS" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFB547"/><stop offset=".55" stop-color="#FF7A3D"/><stop offset="1" stop-color="#B45CFF" stop-opacity=".7"/></linearGradient></defs><rect width="100" height="100" rx="28" fill="#0C0C14"/><rect x=".5" y=".5" width="99" height="99" rx="27.5" fill="none" stroke="rgba(255,255,255,.14)"/><polygon points="50,26 27,78 73,78" fill="url(#gS)"/><path d="M27 78 L50 22 L73 78" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="50" cy="22" r="6.5" fill="#FFE3A3"/></svg><span style="font-weight:900;font-size:20px;letter-spacing:.14em">NAS</span></a><span style="display:flex;gap:12px;align-items:center"><button type="button" onClick="{{ toggleTheme }}" aria-label="{{ themeLabel }}" style="width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--chip);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer"><sc-if value="{{ isDark }}" hint-placeholder-val="{{ false }}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></sc-if><sc-if value="{{ isLight }}" hint-placeholder-val="{{ true }}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></sc-if></button><span style="font-size:15px;color:var(--ink2)">Have an account? <a href="/en/signin" style="font-weight:700">Sign in</a></span></span></div><div style="display:flex;flex-direction:column;gap:8px"><span style="font-size:14px;font-weight:700;color:#9A6A2F">Step 1 of 3</span><h1 style="margin:0;font-size:56px;font-weight:800;letter-spacing:-.05em;line-height:1">Take your <span style="font-family:'Thmanyah Serif Display','Thmanyah Sans','IBM Plex Sans Arabic',serif;font-style:italic;font-weight:700;color:#FF7A3D;letter-spacing:-.02em">seat.</span></h1></div><div role="radiogroup" aria-label="Account type" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px"><sc-for list="{{ types }}" as="t" hint-placeholder-count="4"><button class="role" type="button" role="radio" aria-checked="{{ t.checked }}" onClick="{{ t.pick }}" style="display:flex;align-items:center;gap:12px;padding:10px;border-radius:20px;border:none;outline:{{ t.outline }};outline-offset:-2px;background:{{ t.bg }};cursor:pointer;font-family:inherit;color:var(--ink);text-align:left"><img src="{{ t.img }}" alt="" style="width:54px;height:54px;border-radius:14px;object-fit:cover;flex:none"><span style="display:flex;flex-direction:column;gap:2px;flex-grow:1"><b style="font-size:16px">{{ t.title }}</b><span style="font-size:13px;color:var(--ink3)">{{ t.tag }}</span></span><span style="width:22px;height:22px;border-radius:50%;box-sizing:border-box;border:{{ t.dot }};flex:none"></span></button></sc-for></div><sc-if value="{{ isFestival }}" hint-placeholder-val="{{ false }}"><div style="display:flex;gap:10px;padding:12px 16px;border-radius:16px;background:var(--tile);font-size:14px;line-height:1.5;color:var(--ink2)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9A6A2F" stroke-width="1.8" style="flex:none" aria-hidden="true"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/></svg>Festivals are verified by the NAS team before going live.</div></sc-if><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px"><div style="display:flex;flex-direction:column;gap:8px"><label for="fn" style="font-size:14px;font-weight:600;color:var(--ink2)">{{ nameLabel }}</label><div class="field" style="height:56px;padding:0 16px;border-radius:16px;border:1px solid var(--field);background:var(--card);display:flex;align-items:center"><input id="fn" value="{{ nameVal }}" style="width:100%;border:none;background:transparent;color:var(--ink);font:400 17px 'Thmanyah Sans','IBM Plex Sans Arabic',sans-serif"></div></div><div style="display:flex;flex-direction:column;gap:8px"><label for="se" style="font-size:14px;font-weight:600;color:var(--ink2)">Email</label><div class="field" style="height:56px;padding:0 16px;border-radius:16px;border:1px solid var(--field);background:var(--card);display:flex;align-items:center"><input id="se" type="email" value="{{ emailVal }}" style="width:100%;border:none;background:transparent;color:var(--ink);font:400 17px 'Thmanyah Sans','IBM Plex Sans Arabic',sans-serif"></div></div></div><div style="display:flex;flex-direction:column;gap:8px"><label for="sp" style="font-size:14px;font-weight:600;color:var(--ink2)">Password</label><div class="field" style="height:56px;padding:0 16px;border-radius:16px;border:1px solid var(--field);background:var(--card);display:flex;align-items:center"><input id="sp" type="password" value="a-long-passphrase" style="width:100%;border:none;background:transparent;color:var(--ink);font:400 17px 'Thmanyah Sans','IBM Plex Sans Arabic',sans-serif"></div><div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px"><span style="height:4px;border-radius:4px;background:#1F7A45"></span><span style="height:4px;border-radius:4px;background:#1F7A45"></span><span style="height:4px;border-radius:4px;background:#1F7A45"></span><span style="height:4px;border-radius:4px;background:var(--line)"></span></div></div><label style="display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.5;color:var(--ink2);cursor:pointer"><input type="checkbox" checked style="margin-top:3px;width:16px;height:16px;accent-color:#FF7A3D"><span>I agree to the <a href="#">Terms</a> and <a href="#">Privacy Policy</a>. NAS never takes rights to my films.</span></label><a class="btn-ink" href="{{ nextHref }}" style="height:58px;border-radius:999px;background:var(--btn);color:var(--btnT);font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:10px">Continue <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a></main><aside style="position:relative;min-height:924px;border-radius:40px;overflow:hidden;background:#0E0D0C"><sc-for list="{{ shown }}" as="s" hint-placeholder-count="1"><img class="fade" src="{{ s.img }}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:{{ s.pos }}"></sc-for><div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,0) 35%,rgba(0,0,0,.8))"></div><div class="f1" style="color:#0C0C14;position:absolute;top:40px;right:40px;padding:12px 18px;border-radius:999px;background:rgba(255,255,255,.88);backdrop-filter:saturate(180%) blur(24px);font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px"><span style="width:8px;height:8px;border-radius:50%;background:#C8963E"></span>{{ chip }}</div><div style="position:absolute;left:44px;right:44px;bottom:44px;display:flex;flex-direction:column;gap:16px;color:#fff"><p style="margin:0;font-size:52px;font-weight:800;letter-spacing:-.05em;line-height:1.02">{{ headline }}</p><ul style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;font-size:17px;opacity:.9"><sc-for list="{{ perks }}" as="p" hint-placeholder-count="3"><li style="display:flex;gap:10px;align-items:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#E9C27A" stroke-width="2.6" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>{{ p.t }}</li></sc-for></ul></div></aside></div></template>
<script src="/runtime.js"></script>
<script>
class Component extends DCLogic {
  renderVals() {
    const TT = (this.state && this.state.theme) || this.props.theme || 'light'; const TD = TT === 'dark';
    const sel = (this.state && this.state.sel) || 'creator';
    const defs = [
      { id: 'creator', title: 'Filmmaker', tag: 'Most popular', img: '/i/3027bdc1.webp', pos: '40% center', chip: 'Free for filmmakers', headline: 'Build once. Submit everywhere.', perks: ['Reusable NAS Project', 'Direct submissions', 'Simple, clear status'] },
      { id: 'festival', title: 'Festival', tag: 'Verification required', img: '/i/7c25c354.webp', pos: '30% center', chip: 'Verified by NAS', headline: 'A private studio. A public stage.', perks: ['Isolated workspace', 'Festival AI Profile', 'Programme & attendance'] },
      { id: 'jury', title: 'Jury', tag: 'By invitation', img: '/i/7e7d85b0.webp', pos: 'center', chip: 'Secure screening room', headline: 'Watch. Compare. Judge.', perks: ['Assigned films only', 'Your own AI profile', 'Every view logged'] },
      { id: 'explorer', title: 'Explorer', tag: 'Coming soon', img: '/i/00423918.webp', pos: 'center 40%', chip: 'Coming soon', headline: 'Follow the festival world.', perks: ['Follow festivals', 'Discover projects', 'Curated picks'] }
    ];
    const types = defs.map(d => { const on = d.id === sel; return { themeClass: TD ? 't-dark' : 't-light', isDark: TD, isLight: !TD, themeLabel: TD ? 'Switch to light theme' : 'Switch to dark theme', toggleTheme: () => this.setState({ theme: TD ? 'light' : 'dark' }), ...d, checked: on ? 'true' : 'false',
      outline: on ? '2px solid #FF7A3D' : '0px solid transparent', bg: on ? 'var(--card)' : 'transparent',
      dot: on ? '7px solid #FF7A3D' : '1.5px solid #A9A196', pick: () => this.setState({ sel: d.id }) }; });
    const cur = defs.find(d => d.id === sel);
    const isFestival = sel === 'festival';
    return { ...(types[0]?{themeClass:types[0].themeClass,isDark:types[0].isDark,isLight:types[0].isLight,themeLabel:types[0].themeLabel,toggleTheme:types[0].toggleTheme}:{}), types, isFestival, shown: [{ img: cur.img, pos: cur.pos, key: cur.id }], chip: cur.chip, headline: cur.headline,
      perks: cur.perks.map(t => ({ t })),
      nameLabel: isFestival ? 'Festival name' : 'Full name',
      nameVal: isFestival ? 'Najd Nights Film Festival' : 'Layla Al-Harbi',
      emailVal: isFestival ? 'programme@najdnights.sa' : 'layla@najdfilms.sa',
      nextHref: isFestival ? '#' : (sel === 'jury' ? '#' : '#') };
  }
}
mountDC(Component);
</script>
</body>
</html>
