<style>
body{margin:0}
.t-light{--bg:#F8F5EF;--bg2:#F1ECE3;--card:#FFFFFF;--ink:#0C0C14;--ink2:#56524B;--ink3:#8F897F;--line:rgba(12,12,20,.08);--glass:rgba(255,255,255,.8);--btn:#0C0C14;--btnT:#FFFFFF;--acc:#B8501A;--tile:#EFE8DC;--tile2:#F7F2EA;--orb1:#FFD9A8;--orb2:#E3D5FF;--chip:#FFFFFF}
.t-dark{--bg:#07070C;--bg2:#0D0D15;--card:#12121B;--ink:#F5F2EC;--ink2:#B3AEA6;--ink3:#827E8A;--line:rgba(255,255,255,.09);--glass:rgba(24,24,34,.62);--btn:#F5F2EC;--btnT:#0C0C14;--acc:#FFAE6B;--tile:#13131D;--tile2:#191925;--orb1:rgba(255,140,60,.32);--orb2:rgba(150,100,255,.28);--chip:#15151F}
a{color:var(--acc);text-decoration:none}
.lg-beam{animation:lgBeam 3.6s ease-in-out infinite}
@keyframes lgBeam{0%,100%{opacity:.55}50%{opacity:1}}
.rise{animation:rise 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
.f1{animation:fl 7s ease-in-out infinite}.f2{animation:fl 8s ease-in-out infinite;animation-delay:-2s}.f3{animation:fl 6.5s ease-in-out infinite;animation-delay:-4s}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.spin3d{animation:sp 9s ease-in-out infinite}
@keyframes sp{0%,100%{transform:translateY(0) rotate(3deg)}50%{transform:translateY(-14px) rotate(-3deg)}}
.orb{animation:orb 16s ease-in-out infinite alternate}
@keyframes orb{from{transform:translate(0,0) scale(1)}to{transform:translate(-40px,-30px) scale(1.12)}}
.marq{animation:marq 45s linear infinite}
@keyframes marq{from{transform:translateX(0)}to{transform:translateX(50%)}}
.kb{animation:kb 20s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1.1)}to{transform:scale(1)}}
.wave span{display:block;width:3px;border-radius:3px;background:#FFB547;animation:wv 1.1s ease-in-out infinite}
@keyframes wv{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
.tile{transition:transform .6s cubic-bezier(.2,.8,.2,1),box-shadow .6s ease}.tile:hover{transform:translateY(-6px);box-shadow:0 40px 90px rgba(0,0,0,.18)}
.nl{color:var(--ink2)}.nl:hover{color:var(--ink)}
.btn-ink{transition:transform .25s ease,box-shadow .25s ease}.btn-ink:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(0,0,0,.25)}
.faq summary{list-style:none;cursor:pointer}.faq summary::-webkit-details-marker{display:none}
.faq[open] .pl{transform:rotate(45deg)}
.pl{transition:transform .3s ease}
.cf{position:relative;height:500px;perspective:1900px;perspective-origin:50% 40%}
.cf-card{position:absolute;left:50%;top:20px;width:600px;height:380px;margin-left:-300px;border-radius:30px;overflow:hidden;background:#0C0C14;box-shadow:0 40px 90px rgba(0,0,0,.32);-webkit-box-reflect:below 14px linear-gradient(transparent 72%,rgba(255,255,255,.22));transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.cf-card img{width:100%;height:100%;object-fit:cover;display:block}
.cf-card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.6));pointer-events:none}
.cf-glare{position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.22),rgba(255,255,255,0) 38%);z-index:2;pointer-events:none}
.cf-in{animation:cfIn 1.4s cubic-bezier(.2,.8,.2,1) both}
@keyframes cfIn{from{opacity:0;filter:blur(8px)}to{opacity:1;filter:none}}
.dev{transform:perspective(2400px) rotateX(16deg);transform-origin:50% 0;transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}
.dev:hover{transform:perspective(2400px) rotateX(4deg)}
@keyframes shine{from{background-position:100% 0}to{background-position:-100% 0}}
.band-kb{animation:kb 24s ease-in-out infinite alternate}
.grad{color:inherit}
.shine{color:inherit}
@supports (animation-timeline: view()){
.rv{animation:rv linear both;animation-timeline:view();animation-range:entry 0% cover 28%}
.rv2{animation:rv linear both;animation-timeline:view();animation-range:entry 0% entry 100%}
.rv3{animation:rv linear both;animation-timeline:view();animation-range:entry 15% entry 100%}
.rv4{animation:rv linear both;animation-timeline:view();animation-range:entry 30% entry 100%}
@keyframes rv{from{opacity:0;translate:0 80px;scale:.96}to{opacity:1;translate:0 0;scale:1}}
.dev{animation:devIn linear both;animation-timeline:view();animation-range:entry 0% cover 45%}
@keyframes devIn{from{transform:perspective(2400px) rotateX(22deg) scale(.92);opacity:.6}to{transform:perspective(2400px) rotateX(0deg) scale(1);opacity:1}}
.zoom{animation:zoom linear both;animation-timeline:view();animation-range:entry 0% exit 0%}
@keyframes zoom{from{scale:1.18}to{scale:1}}
.prog{position:fixed;left:0;right:0;top:0;height:3px;z-index:50;transform-origin:0 50%;background:#FF7A3D;animation:prog linear both;animation-timeline:scroll(root)}
@keyframes prog{from{transform:scaleX(0)}to{transform:scaleX(1)}}
}
.ft a{color:rgba(255,255,255,.62);transition:color .2s ease}.ft a:hover{color:#fff}
.ft-card{transition:transform .5s cubic-bezier(.2,.8,.2,1)}.ft-card:hover{transform:translateY(-4px)}
.ft-card img{transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}.ft-card:hover img{transform:scale(1.06)}
.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(48,209,88,.5)}50%{box-shadow:0 0 0 6px rgba(48,209,88,0)}}
</style>
