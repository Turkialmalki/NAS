<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>NAS — Sign in</title>
<meta name="description" content="NAS — the AI-native home for filmmakers, festivals and juries.">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{text-decoration:none}
.t-light{--bg:#F8F5EF;--card:#FFFFFF;--ink:#0C0C14;--ink2:#56524B;--ink3:#8F897F;--line:rgba(12,12,20,.08);--field:#E2DBCF;--btn:#0C0C14;--btnT:#FFFFFF;--acc:#B8501A;--tile:#EFE8DC;--chip:#FFFFFF;--orb1:#FFD9A8}
.t-dark{--bg:#07070C;--card:#12121B;--ink:#F5F2EC;--ink2:#B3AEA6;--ink3:#827E8A;--line:rgba(255,255,255,.09);--field:#2A2A38;--btn:#F5F2EC;--btnT:#0C0C14;--acc:#FFAE6B;--tile:#191925;--chip:#15151F;--orb1:rgba(255,140,60,.3)}
a{color:var(--acc)}
.lg-beam{animation:lgBeam 4s ease-in-out infinite}
@keyframes lgBeam{0%,100%{opacity:.25}50%{opacity:.85}}
.f1{animation:fl 7s ease-in-out infinite}.f2{animation:fl 8s ease-in-out infinite;animation-delay:-3s}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.kb{animation:kb 22s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1.12)}to{transform:scale(1)}}
.orb{animation:orb 16s ease-in-out infinite alternate}
@keyframes orb{from{transform:translate(0,0)}to{transform:translate(30px,-20px)}}
.field{transition:border-color .2s ease, box-shadow .2s ease}
.field:focus-within{border-color:#FF7A3D;box-shadow:0 0 0 4px rgba(255,122,61,.15)}
.field input{outline:none}
.btn-ink{transition:transform .25s ease,box-shadow .25s ease}.btn-ink:hover{transform:translateY(-1px);box-shadow:0 12px 26px rgba(17,17,17,.25);color:#fff}
.soft{transition:background .2s ease}.soft:hover{opacity:.85}
</style>
<style>body{margin:0}</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-tpl"><div class="{{ themeClass }}" style="position:relative;min-height:100vh;box-sizing:border-box;padding:18px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:18px;background:var(--bg);color:var(--ink);transition:background .5s ease,color .5s ease;font-family:'Thmanyah Sans','IBM Plex Sans Arabic',-apple-system,sans-serif;overflow:hidden"><div class="orb" style="position:absolute;left:-160px;top:-160px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,var(--orb1),rgba(0,0,0,0) 65%);pointer-events:none"></div><main style="position:relative;display:flex;flex-direction:column;padding:18px 44px"><div style="display:flex;justify-content:space-between;align-items:center"><a href="/en" style="display:flex;align-items:center;gap:9px;color:var(--ink)" aria-label="NAS home"><svg viewBox="0 0 100 100" width="36" height="36" aria-hidden="true"><defs><linearGradient id="gS" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFB547"/><stop offset=".55" stop-color="#FF7A3D"/><stop offset="1" stop-color="#B45CFF" stop-opacity=".7"/></linearGradient></defs><rect width="100" height="100" rx="28" fill="#0C0C14"/><rect x=".5" y=".5" width="99" height="99" rx="27.5" fill="none" stroke="rgba(255,255,255,.14)"/><polygon points="50,26 27,78 73,78" fill="url(#gS)"/><path d="M27 78 L50 22 L73 78" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="50" cy="22" r="6.5" fill="#FFE3A3"/></svg><span style="font-weight:900;font-size:20px;letter-spacing:.14em">NAS</span></a><span style="display:flex;gap:8px;align-items:center"><button type="button" onClick="{{ toggleTheme }}" aria-label="{{ themeLabel }}" style="width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--chip);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer"><sc-if value="{{ isDark }}" hint-placeholder-val="{{ false }}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></sc-if><sc-if value="{{ isLight }}" hint-placeholder-val="{{ true }}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></sc-if></button><a href="/signin" lang="ar" style="height:38px;padding:0 16px;border-radius:999px;background:var(--chip);border:1px solid var(--line);color:var(--ink);font-size:14px;display:inline-flex;align-items:center">العربية</a></span></div><div style="flex-grow:1;display:flex;align-items:center;justify-content:center"><form style="width:100%;max-width:410px;display:flex;flex-direction:column;gap:20px" onSubmit="{{ submit }}"><div style="display:flex;flex-direction:column;gap:12px;margin-bottom:6px"><h1 style="margin:0;font-size:60px;font-weight:800;letter-spacing:-.05em;line-height:.98">Welcome<br><span style="font-family:'Thmanyah Serif Display','Thmanyah Sans','IBM Plex Sans Arabic',serif;font-style:italic;font-weight:700;letter-spacing:-.02em;color:#FF7A3D">back.</span></h1><p style="margin:0;font-size:18px;color:var(--ink2)">Pick up right where you left off.</p></div><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px"><button class="soft" type="button" style="height:52px;border-radius:16px;border:none;background:var(--tile);color:var(--ink);font:600 15px 'Thmanyah Sans','IBM Plex Sans Arabic',sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>Magic link</button><button class="soft" type="button" style="height:52px;border-radius:16px;border:none;background:var(--tile);color:var(--ink);font:600 15px 'Thmanyah Sans','IBM Plex Sans Arabic',sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 21h18M5 21V8l7-5 7 5v13"/></svg>Festival SSO</button></div><div style="display:flex;align-items:center;gap:14px;font-size:13px;color:var(--ink3)"><span style="flex-grow:1;height:1px;background:var(--line)"></span>or continue with email<span style="flex-grow:1;height:1px;background:var(--line)"></span></div><div style="display:flex;flex-direction:column;gap:8px"><label for="em" style="font-size:14px;font-weight:600;color:var(--ink2)">Email</label><div class="field" style="height:58px;padding:0 18px;border-radius:16px;border:1px solid var(--field);background:var(--card);display:flex;align-items:center"><input id="em" type="email" value="layla@najdfilms.sa" autocomplete="email" style="flex-grow:1;border:none;background:transparent;color:var(--ink);font:400 17px 'Thmanyah Sans','IBM Plex Sans Arabic',sans-serif"></div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="display:flex;justify-content:space-between;align-items:baseline"><label for="pw" style="font-size:14px;font-weight:600;color:var(--ink2)">Password</label><a href="#" style="font-size:14px">Forgot?</a></div><div class="field" style="height:58px;padding:0 8px 0 18px;border-radius:16px;border:1px solid var(--field);background:var(--card);display:flex;align-items:center;gap:8px"><input id="pw" type="{{ pwType }}" value="cinema-at-dusk" autocomplete="current-password" style="flex-grow:1;border:none;background:transparent;color:var(--ink);font:400 17px 'Thmanyah Sans','IBM Plex Sans Arabic',sans-serif"><button type="button" onClick="{{ togglePw }}" aria-label="{{ pwLabel }}" style="width:42px;height:42px;border-radius:12px;border:none;background:transparent;color:var(--ink3);display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div><a class="btn-ink" href="#" style="height:58px;border-radius:999px;background:var(--btn);color:var(--btnT);font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:4px">Sign in <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a><p style="margin:4px 0 0;text-align:center;font-size:15px;color:var(--ink2)">New to NAS? <a href="/en/signup" style="font-weight:700">Create an account</a></p></form></div><p style="margin:0;font-size:13px;color:var(--ink3);text-align:center">Protected sign-in · Sessions and access are audited</p></main><aside style="position:relative;min-height:864px;border-radius:40px;overflow:hidden;background:#0E0D0C"><img class="kb" src="/i/00423918.webp" alt="Glowing digital screens on city buildings at night" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 40%"><div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.2),rgba(0,0,0,0) 30%,rgba(0,0,0,.05) 55%,rgba(0,0,0,.8))"></div><div class="f1" style="color:#0C0C14;position:absolute;top:40px;left:40px;display:flex;align-items:center;gap:12px;padding:12px 18px 12px 12px;border-radius:22px;background:rgba(255,255,255,.88);backdrop-filter:saturate(180%) blur(24px);box-shadow:0 20px 50px rgba(0,0,0,.25)"><img src="/i/1c1ced54.webp" alt="" style="width:46px;height:56px;border-radius:10px;object-fit:cover"><div style="display:flex;flex-direction:column;gap:3px"><span style="font-size:12px;color:#6E6A63">Status update</span><b style="font-size:15px">The Last Doorway · Selected ✓</b></div></div><div class="f2" style="position:absolute;top:150px;right:40px;padding:14px 18px;border-radius:20px;background:rgba(17,17,17,.6);backdrop-filter:blur(20px);color:#fff;font-size:14px;display:flex;align-items:center;gap:10px;border:1px solid rgba(255,255,255,.12)"><span style="width:8px;height:8px;border-radius:50%;background:#E9C27A"></span>3 festivals match your project</div><div style="position:absolute;left:44px;right:44px;bottom:44px;display:flex;flex-direction:column;gap:14px;color:#fff"><p style="margin:0;font-size:56px;font-weight:800;letter-spacing:-.05em;line-height:1">Where every story<br>finds its screen.</p><span style="font-size:16px;opacity:.75">NAS · Film festival ecosystem</span></div></aside></div></template>
<script src="/runtime.js"></script>
<script>
class Component extends DCLogic {
  renderVals() {
    const TT = (this.state && this.state.theme) || this.props.theme || 'light'; const TD = TT === 'dark';
    const show = !!(this.state && this.state.show);
    return { themeClass: TD ? 't-dark' : 't-light', isDark: TD, isLight: !TD, themeLabel: TD ? 'Switch to light theme' : 'Switch to dark theme', toggleTheme: () => this.setState({ theme: TD ? 'light' : 'dark' }), pwType: show ? 'text' : 'password', pwLabel: show ? 'Hide password' : 'Show password',
      togglePw: () => this.setState({ show: !show }), submit: (e) => { if (e && e.preventDefault) e.preventDefault(); } };
  }
}
mountDC(Component);
</script>
</body>
</html>
